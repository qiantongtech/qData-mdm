services:
  redis:
    image: redis:6-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: [redis-server, --appendonly, 'yes', --requirepass, '${REDIS_PASSWORD}']
    ports:
      - "${EXPOSE_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [qdatamdmnet]

  dm8:
    image: ${QDATA_HUB}/dm8:mixed
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CASE_SENSITIVE: ${CASE_SENSITIVE:-0}
      SYSDBA_PWD: ${SYSDBA_PWD}
      SYSAUDITOR_PWD: ${SYSAUDITOR_PWD}
      QDATA_USER: ${QDATA_USER:-QDATA_MDM}
      QDATA_PWD: ${QDATA_PWD}
    ports:
      - "${EXPOSE_DM8_PORT:-5236}:5236"
    volumes:
      - dm8-data:/home/dmdba/data
      - ./database/dm8/init.sql:/home/dmdba/initdata/init.sql:ro
      - ./database/dm8/entrypoint.sh:/entrypoint.sh:ro
      - ./database/dm8/entrypoint-arm64.sh:/usr/local/bin/docker-entrypoint.sh:ro
    healthcheck:
      test: [CMD, bash, -c, 'echo > /dev/tcp/127.0.0.1/5236']
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks: [qdatamdmnet]
